# Recipe #46 — HAProxy MLLP load balancer for Mirth active-active cluster
# Tested on HAProxy 2.9
# Author: Nirmitee.io | License: MIT

global
    log stdout format raw local0 info
    maxconn 4096
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout check   3s
    retries 2

# ---------------------------------------------------------------------------
# Stats / health UI (HTTP)
# ---------------------------------------------------------------------------
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:admin
    stats show-legends

# ---------------------------------------------------------------------------
# MLLP ingress — round-robin across both Mirth nodes
# Health check probes the Mirth admin API (HTTPS:8443) — if the API responds,
# the channel runtime is up and MLLP listener is ready.
# ---------------------------------------------------------------------------
frontend mllp_in
    bind *:6661
    mode tcp
    option tcplog
    default_backend mirth_mllp_pool

backend mirth_mllp_pool
    mode tcp
    balance roundrobin
    option tcp-check
    # Active health check on Mirth admin API via curl-style HTTPS probe
    # Plain TCP-connect check is sufficient and avoids cert issues
    option httpchk
    http-check connect ssl
    http-check send meth GET uri /api/server/version ver HTTP/1.1 hdr Host mirth
    http-check expect status 200
    default-server inter 5s fall 3 rise 2

    server mirth-1 mirth-1:6661 check port 8443 check-ssl verify none
    server mirth-2 mirth-2:6661 check port 8443 check-ssl verify none
