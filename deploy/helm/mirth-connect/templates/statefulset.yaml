apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mirth.fullname" . }}
  labels: {{- include "mirth.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mirth.fullname" . }}-admin
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "mirth.selectorLabels" . | nindent 6 }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels: {{- include "mirth.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "mirth.serviceAccountName" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- if .Values.customLibJars }}
      initContainers:
        - name: fetch-custom-libs
          image: busybox:1.36
          command: ["/bin/sh", "/manifest/fetch.sh"]
          volumeMounts:
            - name: custom-lib
              mountPath: /opt/connect/custom-lib
            - name: customlib-manifest
              mountPath: /manifest
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
      {{- end }}
      containers:
        - name: mirth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: DATABASE
              value: {{ .Values.database.type | quote }}
            - name: DATABASE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.database.maxConnections | quote }}
            - name: VMOPTIONS
              value: "-Xms{{ .Values.jvm.heapMin }} -Xmx{{ .Values.jvm.heapMax }} {{ .Values.jvm.extraOpts }}"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: admin
              containerPort: 8443
              protocol: TCP
            {{- range .Values.service.mllp.ports }}
            - name: {{ .name }}
              containerPort: {{ .port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: admin
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/server/version
              port: admin
              scheme: HTTPS
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: appdata
              mountPath: /opt/connect/appdata
            - name: mirth-properties
              mountPath: /opt/connect/conf/mirth.properties
              subPath: mirth.properties
            {{- if .Values.customLibJars }}
            - name: custom-lib
              mountPath: /opt/connect/custom-lib
            {{- end }}
        {{- if .Values.monitoring.enabled }}
        - name: jmx-exporter
          image: {{ .Values.monitoring.jmxExporter.image }}
          args:
            - "{{ .Values.monitoring.jmxExporter.port }}"
            - "/config/config.yaml"
          ports:
            - name: metrics
              containerPort: {{ .Values.monitoring.jmxExporter.port }}
              protocol: TCP
          volumeMounts:
            - name: jmx-config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
        {{- end }}
      volumes:
        - name: mirth-properties
          configMap:
            name: {{ include "mirth.fullname" . }}-properties
        {{- if .Values.customLibJars }}
        - name: customlib-manifest
          configMap:
            name: {{ include "mirth.fullname" . }}-customlib-manifest
            defaultMode: 0755
        - name: custom-lib
          emptyDir: {}
        {{- end }}
        {{- if .Values.monitoring.enabled }}
        - name: jmx-config
          configMap:
            name: {{ include "mirth.fullname" . }}-jmx-exporter
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: appdata
      spec:
        accessModes: ["{{ .Values.persistence.accessMode }}"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
